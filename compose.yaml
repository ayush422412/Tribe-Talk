services:
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
        VITE_SOCKET_URL: http://localhost:5000
    ports:
      - "5173:80"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      PORT: 5000
      NODE_ENV: development
      CLIENT_URL: http://localhost:5173
      COOKIE_SAME_SITE: lax
      MONGODB_URI: mongodb://mongo:27017/tribetalk
      JWT_SECRET: local-development-secret-change-me
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_ENABLED: "true"
      ELASTICSEARCH_NODE: http://elasticsearch:9200
      ELASTICSEARCH_MESSAGE_INDEX: tribetalk_messages
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started
    volumes:
      - uploads_data:/app/server/uploads

  email-worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: npm run worker:email
    environment:
      NODE_ENV: development
      CLIENT_URL: http://localhost:5173
      MONGODB_URI: mongodb://mongo:27017/tribetalk
      JWT_SECRET: local-development-secret-change-me
      REDIS_URL: redis://redis:6379
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-TribeTalk <no-reply@localhost>}
    depends_on:
      - mongo
      - redis
    restart: on-failure

  search-worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: npm run worker:search
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/tribetalk
      JWT_SECRET: local-development-secret-change-me
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_ENABLED: "true"
      ELASTICSEARCH_NODE: http://elasticsearch:9200
      ELASTICSEARCH_MESSAGE_INDEX: tribetalk_messages
    depends_on:
      - mongo
      - redis
      - elasticsearch
    restart: on-failure

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

volumes:
  mongo_data:
  redis_data:
  elasticsearch_data:
  uploads_data:
